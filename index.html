<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173d2b">
<title>Kerala Fresh Spices | Authentic Kerala Spices</title>
<meta name="description" content="Shop authentic Kerala spices. Order black pepper, cardamom, cinnamon and more across India.">

<style>
:root {
  --green: #173d2b;
  --green2: #285b3b;
  --gold: #e8bd60;
  --cream: #fff8eb;
  --text: #29291f;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--cream);
  color: var(--text);
}

header {
  background: var(--green);
  color: white;
  text-align: center;
  padding: 24px 12px;
}

header h1 {
  margin: 0;
  font: bold 32px Georgia, serif;
}

header p {
  color: var(--gold);
  margin-bottom: 0;
}

nav {
  background: #10291d;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 14px 8px;
}

nav a {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

.hero {
  text-align: center;
  color: white;
  padding: 55px 20px;
  background: linear-gradient(135deg, #244b30, #587447);
}

.hero h2 {
  font: bold 38px Georgia, serif;
  margin-top: 0;
}

.hero p {
  max-width: 600px;
  margin: 0 auto 25px;
  line-height: 1.8;
}

.btn {
  display: inline-block;
  padding: 13px 17px;
  border: 0;
  border-radius: 7px;
  background: var(--gold);
  color: #252519;
  font-size: 15px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

.btn-green {
  background: var(--green);
  color: white;
}

.section {
  max-width: 1100px;
  margin: auto;
  padding: 35px 16px;
}

.section h2 {
  color: var(--green);
  text-align: center;
  font: bold 30px Georgia, serif;
}

.subtitle {
  text-align: center;
  color: #666;
  line-height: 1.7;
}

#search {
  display: block;
  width: 100%;
  max-width: 500px;
  padding: 14px;
  margin: 24px auto;
  border: 1px solid #d8d0bd;
  border-radius: 8px;
  font-size: 16px;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.card {
  min-width: 0;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 3px 12px #00000010;
  padding-bottom: 14px;
}

.card img {
  width: 100%;
  height: 145px;
  object-fit: cover;
  background: #eee5d2;
}

.card h3 {
  font-size: 16px;
  margin: 12px 10px 6px;
}

.description {
  color: #666;
  font-size: 12px;
  line-height: 1.5;
  margin: 0 10px 10px;
}

.price {
  color: var(--green);
  font-weight: bold;
  margin: 10px;
}

.card select {
  width: calc(100% - 20px);
  margin: 10px;
  padding: 10px 5px;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: white;
}

.card .btn {
  width: calc(100% - 20px);
  margin: 0 10px;
  padding: 11px 5px;
}

.box {
  background: white;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #00000010;
  margin-top: 20px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

.cart-item button {
  padding: 7px;
  margin: 2px;
  cursor: pointer;
}

.total {
  text-align: right;
  font-size: 21px;
  font-weight: bold;
  color: var(--green);
  margin: 20px 0;
}

.field {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #d8d0bd;
  border-radius: 7px;
  font-size: 15px;
  background: white;
}

.notice {
  background: #fff1ce;
  padding: 14px;
  border-radius: 8px;
  line-height: 1.7;
  font-size: 14px;
  margin: 15px 0;
  overflow-wrap: anywhere;
}

.payment {
  background: #f1f7ef;
  border: 1px solid #d3e2d0;
  padding: 15px;
  border-radius: 8px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.small {
  color: #777;
  font-size: 12px;
  line-height: 1.6;
}

.qr-wrap {
  text-align: center;
  margin: 20px auto;
  padding: 18px;
  background: white;
  border-radius: 12px;
  max-width: 420px;
  border: 1px solid #e2dccd;
}

.qr-image {
  display: block;
  width: 100%;
  max-width: 320px;
  height: auto;
  margin: 12px auto;
  border: 1px solid #eee;
  border-radius: 8px;
}

footer {
  background: var(--green);
  color: white;
  text-align: center;
  padding: 30px 15px;
  line-height: 1.9;
}

footer a { color: var(--gold); }

@media (min-width: 700px) {
  header h1 { font-size: 40px; }
  .hero h2 { font-size: 48px; }
  .products { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .card img { height: 190px; }
}
</style>
</head>

<body>

<header>
  <h1>🌿 Kerala Fresh Spices</h1>
  <p>Authentic Flavours • Straight from Kerala</p>
</header>

<nav>
  <a href="#home">Home</a>
  <a href="#shop">Shop Spices</a>
  <a href="#cart">My Cart</a>
  <a href="#payment">UPI Payment</a>
  <a href="#contact">Contact</a>
</nav>

<section class="hero" id="home">
  <h
