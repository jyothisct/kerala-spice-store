<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerala Fresh Spices Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f1f6f1;margin:0;color:#24352a}
header{background:#176b3a;color:white;padding:20px}
main{max-width:800px;margin:auto;padding:15px}
.card{background:white;padding:16px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,textarea,button,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#176b3a;color:white;border:0;font-weight:bold}
.item{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}
.hidden{display:none}
.msg{padding:10px;background:#e8f5e9;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h2>🌿 Kerala Fresh Spices</h2>
<p>Administrator Dashboard</p>
</header>
<main>
<div class="card" id="login">
<h3>Administrator Login</h3>
<input id="email" type="email" placeholder="Supabase login email">
<input id="password" type="password" placeholder="Password">
<button onclick="signIn()">Sign In</button>
<div id="loginmsg" class="msg hidden"></div>
</div>

<div id="app" class="hidden">
<div class="card">
<h3>Dashboard</h3>
<p id="who"></p>
<button onclick="refresh()">Refresh</button>
<button onclick="logout()">Sign Out</button>
<div id="msg" class="msg hidden"></div>
</div>
<div class="card">
<h3>Add a Spice</h3>
<input id="pname" placeholder="Product name">
<textarea id="pdesc" placeholder="Description"></textarea>
<input id="pimage" placeholder="Image URL (optional)">
<button onclick="addProduct()">Add Product</button>
</div>
<div class="card">
<h3>Products, Prices and Stock</h3>
<div id="products">Loading...</div>
</div>
<div class="card">
<h3>Customer Orders</h3>
<div id="orders">Loading...</div>
</div>
</div>
</main>
<script>
/* Replace the two values below with your own Supabase details. */
const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const db = window.supabase.createClient(
  SUPABASE_URL.trim(),
  SUPABASE_KEY.trim()
);
const $ = id => document.getElementById(id);

function message(id,text){
  $(id).textContent=text;
  $(id).classList.remove("hidden");
}
function money(paise){
  return "₹"+(Number(paise||0)/100).toFixed(2);
}

async function signIn(){
  message("loginmsg","Connecting...");
  try{
    const {error}=await db.auth.signInWithPassword({
      email:$("email").value.trim(),
      password:$("password").value
    });
    if(error) throw error;
    const {data}=await db.auth.getSession();
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("who").textContent="Signed in: "+data.session.user.email;
    await refresh();
  }catch(e){
    message("loginmsg","Login error: "+e.message);
  }
}

async function refresh(){
  await loadProducts();
  await loadOrders();
}

async function loadProducts(){
  $("products").textContent="Loading products...";
  const {data,error}=await db.from("products")
    .select("id,name,description,image_url,is_active,product_variants(id,pack_size,price_paise,stock_quantity)")
    .order("name");
  if(error){
    $("products").textContent="Product error: "+error.message;
    return;
  }
  $("products").replaceChildren();
  if(!data.length){
    $("products").textContent="No products found.";
    return;
  }
  data.forEach(p=>{
    const box=document.createElement("div");
    box.className="item";
    const title=document.createElement("b");
    title.textContent=p.name;
    box.appendChild(title);

    const edit=document.createElement("button");
    edit.textContent="Edit product";
    edit.onclick=async()=>{
      const name=prompt("Product name",p.name);
      if(name===null)return;
      const description=prompt("Description",p.description||"");
      if(description===null)return;
      const image_url=prompt("Image URL",p.image_url||"");
      if(image_url===null)return;
      const {error}=await db.from("products")
        .update({name,description,image_url,updated_at:new Date().toISOString()})
        .eq("id",p.id);
      if(error)alert(error.message);
      else await loadProducts();
    };
    box.appendChild(edit);

    (p.product_variants||[]).forEach(v=>{
      const text=document.createElement("p");
      text.textContent=v.pack_size+" — "+money(v.price_paise)+" — Stock: "+v.stock_quantity;
      box.appendChild(text);

      const btn=document.createElement("button");
      btn.textContent="Edit price and stock";
      btn.onclick=async()=>{
        const price=prompt("Price in rupees",String(v.price_paise/100));
        if(price===null)return;
        const stock=prompt("Stock quantity",String(v.stock_quantity));
        if(stock===null)return;
        if(!Number.isFinite(Number(price))||Number(price)<0||
           !Number.isInteger(Number(stock))||Number(stock)<0){
          alert("Enter a valid price and stock quantity.");
          return;
        }
        const {error}=await db.from("product_variants").update({
          price_paise:Math.round(Number(price)*100),
          stock_quantity:Number(stock)
        }).eq("id",v.id);
        if(error)alert(error.message);
        else await loadProducts();
      };
      box.appendChild(btn);
    });
    $("products").appendChild(box);
  });
}

async function addProduct(){
  const name=$("pname").value.trim();
  if(!name){alert("Enter a product name.");return;}
  const {error}=await db.from("products").insert({
    name,
    description:$("pdesc").value.trim(),
    image_url:$("pimage").value.trim(),
    is_active:true
  });
  if(error){alert(error.message);return;}
  alert("Product added. Package sizes and prices must be configured separately.");
  $("pname").value="";
  $("pdesc").value="";
  $("pimage").value="";
  await loadProducts();
}

async function loadOrders(){
  $("orders").textContent="Loading orders...";
  const {data,error}=await db.from("orders")
    .select("id,order_number,customer_name,customer_phone,total_paise,order_status,payment_status")
    .order("created_at",{ascending:false}).limit(100);
  if(error){
    $("orders").textContent="Orders unavailable: "+error.message;
    return;
  }
  $("orders").replaceChildren();
  if(!data.length){
    $("orders").textContent="No orders yet.";
    return;
  }
  data.forEach(o=>{
    const box=document.createElement("div");
    box.className="item";
    const title=document.createElement("b");
    title.textContent="Order #"+o.order_number+" — "+(o.customer_name||"Customer");
    box.appendChild(title);
    const details=document.createElement("p");
    details.textContent=(o.customer_phone||"")+" | "+money(o.total_paise)+" | Payment: "+o.payment_status;
    box.appendChild(details);
    const select=document.createElement("select");
    ["new","awaiting_confirmation","awaiting_payment","paid","processing","dispatched","delivered","cancelled"].forEach(s=>{
      const op=document.createElement("option");
      op.value=s;op.textContent=s;
      if(s===o.order_status)op.selected=true;
      select.appendChild(op);
    });
    box.appendChild(select);
    const btn=document.createElement("button");
    btn.textContent="Save order status";
    btn.onclick=async()=>{
      const {error}=await db.from("orders").update({
        order_status:select.value,
        updated_at:new Date().toISOString()
      }).eq("id",o.id);
      if(error)alert(error.message);
      else alert("Order status updated.");
    };
    box.appendChild(btn);
    $("orders").appendChild(box);
  });
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}
</script>
</body>
</html>
